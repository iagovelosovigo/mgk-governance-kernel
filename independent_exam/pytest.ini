[pytest]
addopts = --strict-config --strict-markers
testpaths = tests
markers =
    unit: isolated deterministic behavior
    integration: multi-component lifecycle
    property: property-based invariant
    adversarial: hostile-input security test
    fuzz: malformed/random byte parsing
    replay: nonce and replay defense
    concurrency: atomicity under races
    h14: compromised intelligence does not imply compromised authority
    protected: frozen acceptance invariant

