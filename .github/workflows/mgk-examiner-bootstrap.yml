name: MGK Examiner Bootstrap (one-time)

"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

env:
  MGK_ROOT_MANIFEST_SHA256: ${{ vars.MGK_ROOT_MANIFEST_SHA256 }}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  examiner-bootstrap:
    name: mgk/deterministic-gates
    if: >-
      github.head_ref == 'mgk-autopilot/protected-examiner-v1' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify exact candidate checkout
        env:
          EXPECTED_CANDIDATE: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE"

      - name: Verify the new external root and frozen examinations
        run: |
          python -B orchestrator/tcb/trust.py
          python -B independent_exam/tools/check_frozen.py --root independent_exam
          python -B redteam/validate_artifacts.py

      - name: Run bootstrap regression gates
        run: |
          python -m venv "$RUNNER_TEMP/mgk-bootstrap-venv"
          "$RUNNER_TEMP/mgk-bootstrap-venv/bin/python" -m pip install \
            --disable-pip-version-check \
            -r gates/protected/requirements.lock
          PYTHONPATH=orchestrator/tcb \
            "$RUNNER_TEMP/mgk-bootstrap-venv/bin/python" -m pytest -q \
            gates/protected tests/test_bootstrap_tcb.py

      - name: Publish a bot-authored human-gated Pull Request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const branch = `mgk-autopilot/protected-examiner-bot-${context.runId}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            try {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${branch}`,
                sha: process.env.CANDIDATE_SHA,
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.CANDIDATE_SHA,
              state: "success",
              context: "mgk/deterministic-gates",
              description: "Protected examiner bootstrap passed for this exact commit",
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: `${owner}:${branch}`,
              base: "main",
            });
            if (existing.data.length === 0) {
              await github.rest.pulls.create({
                owner,
                repo,
                head: branch,
                base: "main",
                title: "Security: install protected MGK examiner",
                body: [
                  "Bot-authored promotion of the exact examiner commit after its one-time protected bootstrap passed.",
                  "",
                  `Candidate SHA: ${process.env.CANDIDATE_SHA}`,
                  `Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                  "External root: `1b670a1f2c844f57b5fc40aae2b8f091fd0024a3fa18d38ba5159ba0d18a9b14`",
                  "",
                  "Human approval and protected merge remain mandatory.",
                ].join("\n"),
                maintainer_can_modify: false,
              });
            }
