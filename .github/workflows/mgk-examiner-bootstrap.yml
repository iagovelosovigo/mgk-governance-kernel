name: MGK Examiner Bootstrap Cleanup (one-time)

"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

env:
  MGK_ROOT_MANIFEST_SHA256: ${{ vars.MGK_ROOT_MANIFEST_SHA256 }}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONHASHSEED: "0"

jobs:
  examiner-bootstrap-cleanup:
    name: mgk/deterministic-gates
    if: >-
      github.head_ref == 'mgk-autopilot/protected-examiner-v1' &&
      github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check out the trusted protected base
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify trusted base and external root
        working-directory: trusted
        env:
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_BASE"
          python -B orchestrator/tcb/trust.py
          python -B independent_exam/tools/check_frozen.py --root independent_exam
          python -B redteam/validate_artifacts.py

      - name: Construct the fixed deletion commit as GitHub Actions
        id: construct
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const baseSha = process.env.BASE_SHA;
            const baseCommit = await github.rest.repos.getCommit({ owner, repo, ref: baseSha });
            const deletionTree = await github.rest.git.createTree({
              owner,
              repo,
              base_tree: baseCommit.data.commit.tree.sha,
              tree: [{
                path: ".github/workflows/mgk-examiner-bootstrap.yml",
                mode: "100644",
                type: "blob",
                sha: null,
              }],
            });
            const commit = await github.rest.git.createCommit({
              owner,
              repo,
              message: "security: retire one-time examiner bootstrap",
              tree: deletionTree.data.sha,
              parents: [baseSha],
            });
            const branch = `mgk-autopilot/examiner-cleanup-${context.runId}`;
            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/heads/${branch}`,
              sha: commit.data.sha,
            });
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: commit.data.sha,
              state: "pending",
              context: "mgk/deterministic-gates",
              description: "Verifying the fixed bootstrap deletion",
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
            core.setOutput("candidate_sha", commit.data.sha);
            core.setOutput("branch", branch);

      - name: Check out the exact cleanup candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.construct.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1

      - name: Verify only the authorized deletion
        env:
          CANDIDATE_SHA: ${{ steps.construct.outputs.candidate_sha }}
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          python -B trusted/gates/protected/verify_bootstrap_cleanup.py \
            --trusted-root trusted \
            --candidate-root candidate \
            --candidate-sha "$CANDIDATE_SHA" \
            --out cleanup-report.json

      - name: Publish the bot-authored human-gated cleanup Pull Request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          CANDIDATE_SHA: ${{ steps.construct.outputs.candidate_sha }}
          CANDIDATE_BRANCH: ${{ steps.construct.outputs.branch }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.CANDIDATE_SHA,
              state: "success",
              context: "mgk/deterministic-gates",
              description: "Authorized one-file bootstrap deletion verified",
              target_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
            });
            const created = await github.rest.pulls.create({
              owner,
              repo,
              head: process.env.CANDIDATE_BRANCH,
              base: "main",
              title: "Security: retire one-time MGK examiner bootstrap",
              body: [
                "Bot-authored cleanup after the protected examiner was installed.",
                "",
                "Authorized change: delete `.github/workflows/mgk-examiner-bootstrap.yml` only.",
                `Candidate SHA: ${process.env.CANDIDATE_SHA}`,
                `Workflow run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                "External root remains unchanged because the one-time workflow is outside the protected manifest.",
                "",
                "Human approval and protected merge remain mandatory.",
              ].join("\n"),
              maintainer_can_modify: false,
            });
            core.notice(`Cleanup PR created: ${created.data.html_url}`);
            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: context.issue.number,
              state: "closed",
            });
