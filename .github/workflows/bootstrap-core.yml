name: MGK Bootstrap Core RC.2 - PR Gated

"on":
  workflow_dispatch:

env:
  MGK_ROOT_MANIFEST_SHA256: ${{ vars.MGK_ROOT_MANIFEST_SHA256 }}
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: mgk-autopilot-root
  cancel-in-progress: false

jobs:
  build_patch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require main as the dispatch base
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "This bootstrap must be dispatched from main."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify protected tree against external root anchor
        run: python -B orchestrator/tcb/trust.py

      - name: Invoke Codex
        uses: openai/codex-action@52fe01ec70a42f454c9d2ebd47598f9fd6893d56 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":workspace"
          safety-strategy: "drop-sudo"
          prompt-file: contracts/PHASES.yaml

      - name: Generate candidate patch
        run: |
          git add -N .
          git --no-pager diff --no-ext-diff --no-textconv --binary HEAD > codex.patch
          if [ ! -s codex.patch ]; then
            echo "Empty patch. Aborting."
            exit 1
          fi

      - name: Record build metadata
        run: |
          jq -n \
            --arg base "$(git rev-parse HEAD)" \
            --arg patch "$(sha256sum codex.patch | awk '{print $1}')" \
            --arg phase "F00" \
            '{BASE_SHA: $base, PATCH_SHA256: $patch, PHASE: $phase}' \
            > build_metadata.json

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate
          if-no-files-found: error
          path: |
            codex.patch
            build_metadata.json

  verify_patch:
    runs-on: ubuntu-latest
    needs: build_patch
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify protected tree against external root anchor
        run: python -B orchestrator/tcb/trust.py

      - name: Download candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate
          path: ${{ runner.temp }}/mgk-candidate

      - name: Verify base and patch digest
        run: |
          python -B orchestrator/tcb/check_candidate.py \
            "$RUNNER_TEMP/mgk-candidate/build_metadata.json" \
            "$RUNNER_TEMP/mgk-candidate/codex.patch"

      - name: Verify patch against the frozen phase allowlist
        run: |
          python -B orchestrator/tcb/verify_patch.py \
            "$RUNNER_TEMP/mgk-candidate/codex.patch"

      - name: Apply patch for deterministic gates
        run: git apply --whitespace=error-all "$RUNNER_TEMP/mgk-candidate/codex.patch"

      - name: Run protected gates without executing candidate code
        run: |
          mkdir -p "$RUNNER_TEMP/mgk-gates"
          python -B gates/protected/run_gates.py \
            --patch-scope-pass \
            --subject "$(jq -r '.PATCH_SHA256' "$RUNNER_TEMP/mgk-candidate/build_metadata.json")" \
            "$RUNNER_TEMP/mgk-gates/gate-results.json"

      - name: Check required gates
        run: |
          python -B orchestrator/tcb/check_gates.py \
            "$RUNNER_TEMP/mgk-gates/gate-results.json"

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gate-results
          if-no-files-found: warn
          path: ${{ runner.temp }}/mgk-gates/

  promote:
    runs-on: ubuntu-latest
    needs: verify_patch
    if: success()
    environment: mgk-promotion
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Verify protected tree against external root anchor
        run: python -B orchestrator/tcb/trust.py

      - name: Download candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate
          path: ${{ runner.temp }}/mgk-candidate

      - name: Download gate results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: gate-results
          path: ${{ runner.temp }}/mgk-gates-pre

      - name: Recheck base, patch digest and gates
        run: |
          python -B orchestrator/tcb/check_candidate.py \
            "$RUNNER_TEMP/mgk-candidate/build_metadata.json" \
            "$RUNNER_TEMP/mgk-candidate/codex.patch"
          python -B orchestrator/tcb/check_gates.py \
            "$RUNNER_TEMP/mgk-gates-pre/gate-results.json"
          python -B orchestrator/tcb/verify_patch.py \
            "$RUNNER_TEMP/mgk-candidate/codex.patch"

      - name: Build the final candidate tree
        run: |
          git apply --whitespace=error-all "$RUNNER_TEMP/mgk-candidate/codex.patch"
          python -B orchestrator/tcb/core.py --advance
          BRANCH="mgk-autopilot/f00-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$BRANCH"
          git config user.name "MGK Autopilot"
          git config user.email "autopilot@mgk.local"
          git add -A src/generated orchestrator/tcb/state.json
          git commit -m "Autopilot: F00 candidate passed deterministic gates"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Uncommitted or untracked changes remain after candidate commit."
            git status --short
            exit 1
          fi
          echo "CANDIDATE_BRANCH=$BRANCH" >> "$GITHUB_ENV"

      - name: Test the exact commit proposed for review
        run: |
          mkdir -p "$RUNNER_TEMP/mgk-gates-final"
          python -B gates/protected/run_gates.py \
            --patch-scope-pass \
            --subject "$(git rev-parse HEAD)" \
            "$RUNNER_TEMP/mgk-gates-final/gate-results.json"
          python -B orchestrator/tcb/check_gates.py \
            "$RUNNER_TEMP/mgk-gates-final/gate-results.json"
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            echo "Protected gates modified the exact candidate tree."
            git status --short
            exit 1
          fi

      - name: Create candidate attestation
        run: |
          mkdir -p "$RUNNER_TEMP/mgk-attestation"
          python -B orchestrator/tcb/make_attestation.py \
            "$RUNNER_TEMP/mgk-candidate/build_metadata.json" \
            "$RUNNER_TEMP/mgk-candidate/codex.patch" \
            "$RUNNER_TEMP/mgk-gates-pre/gate-results.json" \
            "$RUNNER_TEMP/mgk-gates-final/gate-results.json" \
            "$RUNNER_TEMP/mgk-attestation/candidate-attestation.json"
          echo "CANDIDATE_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CANDIDATE_TREE_SHA=$(git rev-parse HEAD^{tree})" >> "$GITHUB_ENV"
          echo "CANDIDATE_PATCH_SHA=$(jq -r '.PATCH_SHA256' "$RUNNER_TEMP/mgk-candidate/build_metadata.json")" >> "$GITHUB_ENV"
          echo "CANDIDATE_ATTESTATION_SHA=$(sha256sum "$RUNNER_TEMP/mgk-attestation/candidate-attestation.json" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Upload candidate attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/mgk-attestation/candidate-attestation.json
            ${{ runner.temp }}/mgk-gates-final/gate-results.json

      - name: Push immutable candidate branch
        run: git push --set-upstream origin "$CANDIDATE_BRANCH"

      - name: Publish exact-SHA status and open human-gated Pull Request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ github.token }}
          script: |
            const targetUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.CANDIDATE_COMMIT_SHA,
              state: "success",
              context: "mgk/deterministic-gates",
              description: "Protected F00 gates passed for this exact commit",
              target_url: targetUrl,
            });
            const body = [
              "Automated F00 candidate produced by MGK Bootstrap Core RC.2.",
              "",
              `Candidate commit: ${process.env.CANDIDATE_COMMIT_SHA}`,
              `Candidate tree: ${process.env.CANDIDATE_TREE_SHA}`,
              `Patch SHA-256: ${process.env.CANDIDATE_PATCH_SHA}`,
              `Attestation SHA-256: ${process.env.CANDIDATE_ATTESTATION_SHA}`,
              "",
              "Deterministic gates passed for the exact commit above.",
              "This workflow does not approve or merge the Pull Request.",
              "A human reviewer must inspect the exact head commit and merge it under the protected-main rules."
            ].join("\n");
            const { data: pull } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: process.env.CANDIDATE_BRANCH,
              base: "main",
              title: "MGK Autopilot: F00 verified candidate",
              body,
              draft: false,
            });
            core.notice(`Pull request created: ${pull.html_url}`);
